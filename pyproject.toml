[project]
name = "sparseqid"
version = "0.1.0"
description = "Online multi-camera 3D tracking by ID prediction over recurrent sparse queries"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
authors = [
    { name = "Pragyan Shrestha" },
    { name = "Haruto Nakayama" },
    { name = "Atom Scott" },
]
dependencies = [
    "decord>=0.6.0",
    "einops>=0.7",
    "numpy>=1.26",
    "omegaconf>=2.3",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "scipy>=1.11",
    "timm>=1.0.27",
    "torch>=2.7",
    "torchvision>=0.22",
]

[project.scripts]
sqid = "sparseqid.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "docs/**",
    "tests/**",
    "licenses/**",
    "NOTICE",
    "uv.lock",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "weights: requires local paper checkpoints and builds the full detector",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "src/sparseqid/detector",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"]
